<!DOCTYPE html>
<html lang="fa" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

        <title>Array Methods</title>
        <style>
            #btn_update{
                display: none;
            }
        </style>
    </head>
    <body>

        <div class="container mt-3">
            <h2>لیست شاگرد ها</h2>
            <div class="mb-3 mt-3">
                <label for="name">اسم:</label>
                <input type="text" class="form-control" id="name"
                    placeholder="اسم خود را وارد کنید" name="name">

                    <input type="hidden" value="" id="index_for_edit">
            </div>

            <div class="mb-3 mt-3">
                <label for="age">سن:</label>
                <input type="number" class="form-control" id="age"
                    placeholder="سن خود را وارد کنید" name="age">
            </div>

            <button type="button" class="btn btn-info" id="btn_update"
            onclick="updateStudent()">ویرایش کردن</button>

            <button type="button" class="btn btn-primary" id="btn_add"
                onclick="AddNewStudent()">اضافه</button>

            <button type="button" class="btn btn-success"
                onclick="removeStudentFromEnd()">حذف کردن از آخر</button>

            <button type="button" class="btn btn-warning"
                onclick="removeStudentFromStart()">حذف کردن از اول</button>

        </div>

        <div class="container mt-3">
            <h2> اضافه کردن شاگرد ها</h2>
            <table class="table table-striped student_table">
                <thead>
                    <tr>
                        <th>شماره</th>
                        <th>اسم</th>
                        <th>سن</th>
                        <th>اجرا</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>

        </div>
		
		<div class="container mt-3">
            <h2>Employees</h2>
            <table class="table table-striped" id="employee_table">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Name</th>
                        <th>Last Name</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>

        </div>

        <script src="js.js"></script>
    </body>
</html>
