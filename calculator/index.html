<!DOCTYPE html>
<html>
    <head>
        <title>calculator</title>
        <link rel="stylesheet" href="css/style.css"/>
    </head>
    <body>
        <div class="calculator">
            <div class="output">
                <input type="text" class="text input_output_box" placeholder="0" value=""/>
            </div>
            <div>

                <input type="button" value="AC" class="oparator btn_clear"/>

                <input type="button" value="DEL" class="oparator btn_delete"/>

                <input type="button" value="%" class="oparator cal_btns"/>
                <input type="button" value="/" class="oparator cal_btns"/>
            </div>
            <div>
                <input type="button" value="7" class="cal_btns"/>
                <input type="button" value="8" class="cal_btns"/>
                <input type="button" value="9" class="cal_btns"/>
                <input type="button" value="*" class="oparator cal_btns"/>
            </div>
            <div>
                <input type="button" value="4" class="cal_btns"/>
                <input type="button" value="5" class="cal_btns"/>
                <input type="button" value="6" class="cal_btns"/>
                <input type="button" value="-" class="oparator cal_btns"/>
            </div>
            <div>
                <input type="button" value="1" class="cal_btns"/>
                <input type="button" value="2" class="cal_btns"/>
                <input type="button" value="3" class="cal_btns"/>
                <input type="button" value="+" class="oparator cal_btns"/>
            </div>
            <div>
                <input type="button" value="." class="oparator cal_btns"/>
                <input type="button" value="0" class="cal_btns"/>

                <input type="button" value="=" class="equal oparator"/>
            </div>
        </div>
        
        <script src="js/myscript.js"></script>
    </body>
</html>
