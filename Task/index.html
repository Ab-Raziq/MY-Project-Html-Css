<html dir="rtl">
    <head>
        <title>home</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="style.css" rel="stylesheet"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>
    <body>
       
<div class="container">
    <div class="container-from">
      <h2>فورم ثبت نام</h2>
      <form onsubmit="getFormData(event)" novalidate>
  
  
        <div class="mb-3 mt-3">
          <label for="username">نام:</label>
          <input 
          type="text" 
          class="form-control" 
          id="username" 
          placeholder="نام خود را وارد کنید" 
          name="username">
          <span class="error_msg"></span>
        </div>
  
      
  
        <div class="mb-3 mt-3">
          <label for="lastname">تخلص:</label>
          <input 
          type="text" 
          class="form-control" 
          id="lastname" 
          placeholder="تخلص خود را وارد کنید" 
          required
          >
          <span class="error_msg"></span>
        </div>
  
        <div class="mb-3 mt-3">
          <label for="fathername">نام پدر:</label>
          <input 
          type="text" 
          class="form-control" 
          id="fathername" 
          placeholder="نام پدر خود را وارد کنید" 
          required
          >
          <span class="error_msg"></span>
        </div>
  
  
        <div class="mb-3 mt-3">
          <label for="email">ایمیل:</label>
          <input 
          type="email" 
          class="form-control" 
          id="email" 
          placeholder="ایمیل خود را وارد کنید" 
          required
          >
          <span class="error_msg"></span>
        </div>
  
        <div class="mb-3">
          <label for="pwd">رمز:</label>
          <input 
          type="password" 
          class="form-control" 
          id="pwd" 
          placeholder="رمز خود را وارد کنید" 
          required
          >
          <span class="error_msg"></span>
        </div>
  
  
        <div class="mb-3 mt-3">
          <label for="adress">آدرس خانه:</label>
          <input type="text" class="form-control" id="adress" placeholder="آدرس خانه خود را وارد کنید" name="adress">
          <span class="error_msg"></span>
        </div>
        
        
        <div class="mb-3">
          <label for="code">کد:</label>
          <input type="code" class="form-control" id="code" placeholder="کد خود را وارد کنید" name="code">
          <span class="error_msg"></span>
        </div>
    
        <div class="form-check mb-3">
          <label class="form-check-label">
            <input class="form-check-input" type="checkbox" name="agree"> 
              من موافقم!
          </label>
         
          <span class="error_msg"></span>
          
        </div>
    
        <button type="submit" class="btn btn-primary">Submit</button>
    
        
        
      </form>
    </div>
</div>
        <script src="java_script.js"></script>
    </body>
</html>
