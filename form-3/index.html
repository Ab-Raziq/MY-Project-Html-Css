<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <title>Form Validation</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet"/>
  <style>
      .error_msg{
        color:red;
        display: none;
      }
      .has_error{
        display: block;
      }
  </style>
</head>
<body>

<div class="container">
  <div class="container-from">
    <h2>فورم ثبت نام</h2>
    <form onsubmit="submitFormData(event)" novalidate>


      <div class="mb-3 mt-3 form-input-wrapper">
        <label for="name">نام:</label>
        <input 
          type="text" 
          class="form-control" 
          id="name" 
          placeholder="نام خود را وارد کنید" 
          name="name"
          required
          max="10"
          min="3"
          data-label="نام">

        <span class="error_msg"></span>

      </div>

    

      <div class="mb-3 mt-3 form-input-wrapper">
        <label for="lastname">تخلص:</label>
        <input 
          type="text" 
          class="form-control" 
          id="lastname" 
          placeholder="تخلص خود را وارد کنید" 
          name="lastname"
          required
          max="64"
          min="3"
          data-label="تخلص">

        <span class="error_msg"></span>

      </div>

      <div class="mb-3 mt-3 form-input-wrapper">
        <label for="fathername">نام پدر:</label>
        <input 
          type="text" 
          class="form-control" 
          id="fathername" 
          placeholder="نام پدر خود را وارد کنید" 
          name="fathername"
          required
          max="64"
          min="3"
          data-label="نام پدر">

        <span class="error_msg"></span>

      </div>


      <div class="mb-3 mt-3 form-input-wrapper">
        <label for="email">ایمیل:</label>
        <input 
          type="email"
          class="form-control" 
          id="email" 
          placeholder="ایمیل خود را وارد کنید" 
          name="email"
          required
          max="64"
          min="3"
          data-label="ایمیل">

        <span class="error_msg"></span>

      </div>

      <div class="mb-3 form-input-wrapper">
        <label for="pwd">رمز:</label>
        <input 
          type="password" 
          class="form-control" 
          id="pwd" 
          placeholder="رمز خود را وارد کنید" 
          name="pwd"
          required
          max="64"
          min="3"
          data-label="رمز">

        <span class="error_msg"></span>

      </div>


      <div class="mb-3 mt-3 form-input-wrapper">
        <label for="adress">آدرس خانه:</label>
        <input 
          type="text" 
          class="form-control" 
          id="adress" 
          placeholder="آدرس خانه خود را وارد کنید" 
          name="adress"
          required
          max="64"
          min="3"
          data-label="آدرس خانه">

        <span class="error_msg"></span>
      </div>
      
      
      <div class="mb-3 form-input-wrapper">
        <label for="code">کد:</label>
        <input 
          type="number" 
          class="form-control" 
          id="code" 
          placeholder="کد خود را وارد کنید" 
          name="code"
          required
          max="6"
          min="6"
          data-label="کد">

        <span class="error_msg"></span>

      </div>


      <div class="mb-3 form-input-wrapper">
        <label for="code">شماره تماس</label>
        <input 
          type="number" 
          class="form-control" 
          id="phone" 
          placeholder="شماره تماس را وارد نمائید" 
          name="phone"
          max="11"
          min="11"
          data-label="شماره تماس">

        <span class="error_msg"></span>

      </div>

      <div class="mb-3 form-input-wrapper">
        <label for="age">سن: </label>
        <input 
          type="number" 
          class="form-control" 
          id="age" 
          placeholder="سن خودرا وارد کنید" 
          name="age"
          data-label="سن">

        <span class="error_msg"></span>

      </div>
  
      <div class="form-check mb-3 form-input-wrapper">
        <label class="form-check-label">
          <input 
            class="form-check-input" 
            type="checkbox" name="agree" required  data-label="من موافقم"> 
            من موافقم!
            <span class="d-block error_msg"></span>
        </label>
        
      </div>
  
      <button type="submit" class="btn btn-primary">Submit</button>
  
    
    </form>
  
      <div id="form_data" style="display: none;"></div>

  </div>
</div>

  <script src="js.js"></script>

</body>
</html>
