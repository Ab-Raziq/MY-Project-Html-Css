<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Bootstrap Example</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body id="nav_body">

        <nav class="navbar navbar-expand-sm navbar-dark"
            id="navabar_menu">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Logo</a>
                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#collapsibleNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="collapsibleNavbar">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="#">Link</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Link</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Link</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#"
                                role="button"
                                data-bs-toggle="dropdown">Dropdown</a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item"
                                        href="#">Link</a></li>
                                <li><a class="dropdown-item" href="#">Another
                                        link</a></li>
                                <li><a class="dropdown-item" href="#">A third
                                        link</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container-fluid mt-3">
            <h3>Navbar With Dropdown</h3>
            <p>This example adds a dropdown menu in the navbar.</p>
        </div>

        <div class="container color">
            <div class="row">
                <div class="col-lg-12">
                    <form id="settings_form" onsubmit="changeColor(event)">
                        <h2>Settings</h2>
                        <label for="sel1" class="form-label">Nav Color:</label>
                        <select class="form-select" id="nav_color">
                            <option value>----</option>
                            <option value="green">Green</option>
                            <option value="blue">Blue</option>
                            <option value="purple">Purple</option>
                        </select>
                        <br>

                        <button type="submit"
                            class="btn btn-primary mt-3">Change</button>
                    </form>
                </div>
            </div>
        </div>


        
        <div class="container font">
            <div class="row">
                <div class="col-lg-12">
                    <form id="settings_form" onsubmit="changeFont(event)">
                        <h2>Settings</h2>
                        <label for="sel1" class="form-label">Font size:</label>
                        <select class="form-select" id="nav_font">
                            <option value>----</option>
                            <option value="20px">20px</option>
                            <option value="30px">30px</option>
                            <option value="40px">40px</option>
                        </select>
                        <br>

                        <button type="submit"
                            class="btn btn-primary mt-3">Change</button>
                    </form>
                </div>
            </div>
        </div>


        <div class="container theme">
            <div class="row">
                <div class="col-lg-12">
                    <form id="settings_form" onsubmit="changeTheme(event)">
                        <h2>Settings</h2>
                        <label for="sel1" class="form-label">changeTheme:</label>
                        <select class="form-select" id="nav_theme">
                            <option value="Theme">Theme</option>
                            <option value="gray">Gray</option>
                            <option value="brown">Brown</option>
                            <option value="orange">Orange</option>
                        </select>
                        <br>

                        <button type="submit"
                            class="btn btn-primary mt-3">Change</button>
                    </form>
                </div>
            </div>
        </div>


        <script src="js.js"></script>
    </body>

</html>
